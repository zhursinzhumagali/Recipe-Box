<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Recipe-Box</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="register">
    <aside class="intro">
      <a href="index.html" class="logo">Ну Жан!</a>
      <h1 class="headline">Соберите свою коробку рецептов</h1>
      <ul class="perks">
        <li>Сохраняйте любимые блюда в избранное</li>
        <li>Оценивайте рецепты и делитесь мнением</li>
        <li>Публикуйте собственные рецепты</li>
      </ul>
    </aside>

    <section class="panel">
      <form id="register-form" class="form" novalidate>
        <h2>Создать аккаунт</h2>

        <noscript><p class="alert">Для регистрации включите JavaScript в браузере</p></noscript>
        <p id="server-error" class="alert" role="alert" hidden></p>

        <div class="field">
          <label for="name">Имя</label>
          <input id="name" type="text" autocomplete="name">
          <p id="name-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email">
          <p id="email-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <div class="password-wrap">
            <input id="password" type="password" autocomplete="new-password" aria-describedby="password-hint">
            <button id="toggle-password" class="toggle" type="button">Показать</button>
          </div>
          <p id="password-hint" class="field-hint">Не короче 8 символов</p>
          <p id="password-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <label for="confirm">Повторите пароль</label>
          <input id="confirm" type="password" autocomplete="new-password">
          <p id="confirm-error" class="field-error" hidden></p>
        </div>

        <button id="submit-button" class="submit" type="submit">Зарегистрироваться</button>

        <p class="switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
      </form>
    </section>
  </main>
</body>
</html>
